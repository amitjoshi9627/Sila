    <!-- Outer Precision Ring -->
    <circle cx="60" cy="60" r="50" stroke-width="2.5" opacity="0.95"/>
    
    <!-- Inner Lens Aperture / Organic S-Curve Motif -->
    <path d="M 38 60 C 38 42, 54 34, 72 38 C 82 40, 84 52, 74 60 C 64 68, 46 72, 46 84 C 46 94, 60 94, 76 86" stroke-width="2.2" opacity="0.9"/>
    
    <!-- Minimal Aperture Focus Ring & Core -->
