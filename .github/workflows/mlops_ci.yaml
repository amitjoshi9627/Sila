name: Sila MLOps CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Setup uv (Python Package Manager)
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Install Dependencies
      run: |
        uv sync
        cd src/sila/ui && npm install

    - name: Run Code Quality Checks
      # Runs ruff formatting, ruff linting, and mypy type checks
      run: make lint

    - name: Run Unit Tests
      # Runs mocked unit tests without pulling heavy ML model weights
      run: uv run pytest tests/ --ignore=tests/integration

    - name: Verify UI Build
      # Ensures the React frontend successfully compiles without TS/syntax errors
      run: cd src/sila/ui && npm run build