[project]
name = "sila"
version = "0.6.1"
description = "Sift your raw footage chaos into searchable, reversible, local-first media organization."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.6.3",
    "click>=8.4.1",
    "dvc>=3.67.1",
    "fastapi>=0.136.3",
    "ffmpeg-python>=0.2.0",
    "honcho>=2.0.0",
    "lancedb>=0.33.0",
    "librosa>=0.11.0",
    "llama-cpp-python>=0.3.32",
    "numpy>=2.4.6",
    "opencv-python-headless>=4.13.0.92",
    "pillow>=12.2.0",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "ruff>=0.15.16",
    "sentence-transformers>=5.5.1",
    "torch>=2.12.0",
    "tqdm>=4.68.1",
    "transformers>=5.10.2",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
files = ["src"]
mypy_path = "."
explicit_package_bases = true



